<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monitor Hałasu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    color: #fff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    user-select: none;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* ── STATUS LAMP ── */
  #lamp {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #333;
    box-shadow: 0 0 0 8px #222;
    transition: background 0.12s, box-shadow 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }

  #lamp.ok   { background: #22c55e; box-shadow: 0 0 60px #22c55e88, 0 0 0 8px #222; }
  #lamp.warn { background: #f97316; box-shadow: 0 0 60px #f9731688, 0 0 0 8px #222; }
  #lamp.loud { background: #ef4444; box-shadow: 0 0 80px #ef444488, 0 0 0 8px #222; }

  #status-text {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.15s;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #lamp.ok   #status-text,
  #lamp.warn #status-text,
  #lamp.loud #status-text { opacity: 1; }

  /* ── CISZEJ BANNER ── */
  #ciszej {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #ef4444;
    text-shadow: 0 0 30px #ef4444;
    display: none;
    text-transform: uppercase;
  }
  #ciszej.blink { display: block; animation: blink 0.5s step-start infinite; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── LEVEL BAR ── */
  #bar-wrap {
    width: 100%;
    max-width: 340px;
    height: 14px;
    background: #2a2a2a;
    border-radius: 7px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0%;
    border-radius: 7px;
    background: #22c55e;
    transition: width 0.08s, background 0.12s;
  }

  /* ── dB READOUT ── */
  #db-readout {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 100px;
    text-align: center;
    opacity: 0.85;
  }

  /* ── SETTINGS ── */
  #settings {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .row label {
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    opacity: 0.6;
    text-transform: uppercase;
    width: 120px;
    flex-shrink: 0;
  }

  .row input[type=range] {
    flex: 1;
    accent-color: #f97316;
    height: 6px;
    cursor: pointer;
  }

  .val {
    font-size: 0.85rem;
    font-weight: 700;
    width: 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── START BUTTON ── */
  #start-btn {
    padding: 14px 48px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 20px #2563eb55;
  }
  #start-btn:active { transform: scale(0.96); }
  #start-btn:hover  { background: #1d4ed8; }
  #start-btn.stop   { background: #dc2626; box-shadow: 0 4px 20px #dc262655; }

  #perm-msg {
    font-size: 0.8rem;
    opacity: 0.45;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>Monitor Hałasu</h1>

<div id="lamp">
  <span id="status-text">–</span>
</div>

<div id="ciszej">CISZEJ!</div>

<div id="db-readout">– dB</div>

<div id="bar-wrap"><div id="bar"></div></div>

<div id="settings">
  <div class="row">
    <label>Ok → Ostrzeżenie</label>
    <input type="range" id="th-warn" min="30" max="90" value="55">
    <span class="val" id="th-warn-val">55 dB</span>
  </div>
  <div class="row">
    <label>Ostrzeżenie → Głośno</label>
    <input type="range" id="th-loud" min="40" max="100" value="70">
    <span class="val" id="th-loud-val">70 dB</span>
  </div>
</div>

<button id="start-btn">Uruchom mikrofon</button>
<p id="perm-msg">Naciśnij przycisk, a przeglądarka poprosi o dostęp do mikrofonu.</p>

<script>
  const lamp     = document.getElementById('lamp');
  const ciszej   = document.getElementById('ciszej');
  const bar      = document.getElementById('bar');
  const dbOut    = document.getElementById('db-readout');
  const statusTx = document.getElementById('status-text');
  const btn      = document.getElementById('start-btn');
  const permMsg  = document.getElementById('perm-msg');

  const sliderWarn = document.getElementById('th-warn');
  const sliderLoud = document.getElementById('th-loud');
  const valWarn    = document.getElementById('th-warn-val');
  const valLoud    = document.getElementById('th-loud-val');

  let audioCtx, analyser, source, rafId, running = false;

  // ── slider sync ──────────────────────────────────────────────
  sliderWarn.addEventListener('input', () => {
    valWarn.textContent = sliderWarn.value + ' dB';
    if (+sliderWarn.value >= +sliderLoud.value) {
      sliderLoud.value = +sliderWarn.value + 5;
      valLoud.textContent = sliderLoud.value + ' dB';
    }
  });
  sliderLoud.addEventListener('input', () => {
    valLoud.textContent = sliderLoud.value + ' dB';
    if (+sliderLoud.value <= +sliderWarn.value) {
      sliderWarn.value = +sliderLoud.value - 5;
      valWarn.textContent = sliderWarn.value + ' dB';
    }
  });

  // ── start / stop ─────────────────────────────────────────────
  btn.addEventListener('click', async () => {
    if (running) { stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.6;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      running = true;
      btn.textContent = 'Zatrzymaj';
      btn.classList.add('stop');
      permMsg.style.display = 'none';
      tick();
    } catch (e) {
      permMsg.textContent = 'Brak dostępu do mikrofonu. Sprawdź uprawnienia w przeglądarce.';
    }
  });

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    if (source) source.disconnect();
    if (audioCtx) audioCtx.close();
    lamp.className = '';
    statusTx.textContent = '–';
    ciszej.className = '';
    bar.style.width = '0%';
    dbOut.textContent = '– dB';
    btn.textContent = 'Uruchom mikrofon';
    btn.classList.remove('stop');
    permMsg.style.display = '';
  }

  // ── audio loop ───────────────────────────────────────────────
  const dataArray = new Float32Array(2048);

  function tick() {
    if (!running) return;
    rafId = requestAnimationFrame(tick);

    analyser.getFloatTimeDomainData(dataArray);

    // RMS → dB
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
    const rms = Math.sqrt(sum / dataArray.length);
    const db  = rms > 0 ? 20 * Math.log10(rms) : -Infinity;

    // map roughly -60..0 dBFS to 0..100 dB "display" scale
    const display = Math.max(0, Math.min(100, db + 80));

    const tWarn = +sliderWarn.value;
    const tLoud = +sliderLoud.value;

    dbOut.textContent = isFinite(db) ? display.toFixed(1) + ' dB' : '– dB';

    // bar width
    bar.style.width = display.toFixed(1) + '%';

    if (display >= tLoud) {
      lamp.className = 'loud';
      statusTx.textContent = 'Za głośno!';
      ciszej.className = 'blink';
      bar.style.background = '#ef4444';
    } else if (display >= tWarn) {
      lamp.className = 'warn';
      statusTx.textContent = 'Trochę głośno';
      ciszej.className = '';
      bar.style.background = '#f97316';
    } else {
      lamp.className = 'ok';
      statusTx.textContent = 'OK';
      ciszej.className = '';
      bar.style.background = '#22c55e';
    }
  }
</script>
</body>
</html>
